name: Deploy

# main 머지 시 EC2 에 반영. 인바운드 포트 없이 S3 + SSM Run Command 로 전달
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 인프라 준비 전에는 건너뛴다 - 저장소 Variables 에 EC2_INSTANCE_ID 가 생기면 동작
    if: vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      RELEASE: s3://${{ vars.DEPLOY_BUCKET }}/releases/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 테스트와 bootJar 빌드
        run: chmod +x ./gradlew && ./gradlew test bootJar

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 릴리스 업로드
        run: |
          mkdir release
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar')" release/app.jar
          cp deploy/ec2/run.sh deploy/ec2/deploy.sh deploy/ec2/gongsi.service release/
          aws s3 cp --recursive release "$RELEASE"

      - name: EC2 에 설치
        run: |
          params=$(jq -nc --arg r "$RELEASE" \
            '{commands: ["aws s3 cp \($r)/deploy.sh /tmp/gongsi-deploy.sh", "bash /tmp/gongsi-deploy.sh \($r)"]}')
          id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "gongsi ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)

          # deploy.sh 의 기동 확인이 최대 150초라 넉넉히 5분 기다린다
          for _ in $(seq 1 60); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; esac
            break
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status=$status"
          [ "$status" = "Success" ]
