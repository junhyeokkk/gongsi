name: Release

# main 머지 시 GitHub Release 로 게시. EC2 가 타이머로 받아 간다 (AWS 자격증명 불필요)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 테스트와 bootJar 빌드
        run: chmod +x ./gradlew && ./gradlew test bootJar

      - name: 릴리스 파일 준비
        run: |
          mkdir release
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar')" release/app.jar
          cp deploy/ec2/*.sh deploy/ec2/*.service deploy/ec2/*.timer deploy/migrate/fingerprint.sql release/
          rm release/user-data.sh
          echo "$GITHUB_SHA" > release/VERSION

      - name: GitHub Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_SHA::7}" release/* \
            --target "$GITHUB_SHA" --latest \
            --title "build ${GITHUB_SHA::7}" \
            --notes "main ${GITHUB_SHA} 자동 빌드. EC2 가 10분 안에 받아 간다"
