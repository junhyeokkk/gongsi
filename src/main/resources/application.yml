spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gongsi}
    username: ${DB_USER:gongsi}
    password: ${DB_PASS:gongsi}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

fss:
  base-url: https://finlife.fss.or.kr/finlifeapi
  auth-key: ${FINLIFE_API_KEY:}
  timeout-ms: 15000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
